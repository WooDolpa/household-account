<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용내역 관리 - 가계부</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/receipt.css}">
    <link rel="stylesheet" th:href="@{/css/toast.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/air-datepicker@3.6.0/air-datepicker.css">
</head>
<body>

<header class="header">
    <span class="header__title">가계부</span>
</header>

<div class="layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="main">
        <div class="page-header">
            <h1 class="page-title">사용내역 관리</h1>
            <div class="page-header__actions">
                <button class="btn btn--secondary" id="bulkAddBtn">일괄 등록</button>
                <button class="btn btn--primary" id="addReceiptBtn">+ 등록</button>
            </div>
        </div>

        <!-- 필터 -->
        <div class="filter-panel">
            <div class="filter-row">
                <div class="filter-group">
                    <label class="filter-label">기간</label>
                    <div class="filter-date-wrap">
                        <div class="filter-date-range">
                            <input type="text" class="form-input filter-date-input" id="filterStartDate" placeholder="시작일 선택" readonly>
                            <span class="filter-date-sep">~</span>
                            <input type="text" class="form-input filter-date-input" id="filterEndDate" placeholder="종료일 선택" readonly>
                        </div>
                        <div class="filter-date-quick">
                            <button class="btn-quick" data-quick="this-month">이번달</button>
                            <button class="btn-quick" data-quick="last-month">저번달</button>
                            <button class="btn-quick" data-quick="last-3-months">최근 3개월</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="filter-divider"></div>
            <div class="filter-row">
                <div class="filter-group">
                    <label class="filter-label">카테고리</label>
                    <div class="filter-select-wrap">
                        <select class="form-select" id="filterParentCategory">
                            <option value="">대분류 전체</option>
                            <option th:each="p : ${parentCategoryList}" th:value="${p.id}" th:text="${p.name}"></option>
                        </select>
                        <select class="form-select" id="filterChildCategory">
                            <option value="">소분류 전체</option>
                        </select>
                    </div>
                </div>
                <div class="filter-group">
                    <label class="filter-label">명칭</label>
                    <input type="text" class="form-input filter-name-input" id="filterName" placeholder="사용명 검색">
                </div>
                <div class="filter-actions">
                    <button class="btn btn--primary" id="searchBtn">조회</button>
                    <button class="btn btn--secondary" id="resetBtn">초기화</button>
                </div>
            </div>
        </div>

        <!-- 총계 -->
        <div class="receipt-summary hidden" id="receiptSummary"></div>

        <!-- 테이블 컨트롤 -->
        <div class="table-controls">
            <div class="table-controls__size">
                <label class="table-controls__label" for="pageSizeSelect">페이지당 표시</label>
                <select class="form-select table-controls__select" id="pageSizeSelect">
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                    <option value="300">300</option>
                </select>
            </div>
        </div>

        <!-- 테이블 목록 -->
        <div class="receipt-table-wrap" id="receiptTableWrap">
            <table class="receipt-table">
                <thead>
                    <tr>
                        <th>사용일</th>
                        <th>사용명</th>
                        <th>카테고리</th>
                        <th>사용구분</th>
                        <th class="col-amount">금액</th>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody id="receiptTbody"></tbody>
            </table>
        </div>
        <div class="receipt-empty hidden" id="receiptEmpty">조회된 사용내역이 없습니다</div>

        <!-- 페이지네이션 -->
        <div class="pagination" id="pagination"></div>

        <!-- 모달 -->
        <div class="modal-overlay hidden" id="modalOverlay">
            <div class="modal">
                <h2 class="modal__title" id="modalTitle">사용내역 등록</h2>

                <div class="form-group">
                    <label class="form-label" for="modalName">사용명</label>
                    <input type="text" class="form-input" id="modalName" placeholder="사용명을 입력하세요" maxlength="32">
                    <span class="form-error hidden" id="modalNameError">사용명을 입력해 주세요</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="modalAmount">금액</label>
                    <input type="text" class="form-input" id="modalAmount" placeholder="금액을 입력하세요" inputmode="numeric">
                    <span class="form-error hidden" id="modalAmountError">금액을 입력해 주세요</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="modalUsedDate">사용일</label>
                    <input type="text" class="form-input" id="modalUsedDate" placeholder="날짜를 선택하세요" readonly>
                    <span class="form-error hidden" id="modalUsedDateError">사용일을 선택해 주세요</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="modalParentCategory">대분류</label>
                    <select class="form-select" id="modalParentCategory">
                        <option value="">대분류를 선택하세요</option>
                        <option th:each="p : ${parentCategoryList}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                    <span class="form-error hidden" id="modalParentError">대분류를 선택해 주세요</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="modalChildCategory">소분류</label>
                    <select class="form-select" id="modalChildCategory" disabled>
                        <option value="">소분류를 선택하세요</option>
                    </select>
                    <span class="form-error hidden" id="modalChildError">소분류를 선택해 주세요</span>
                </div>

                <div class="form-group">
                    <label class="form-label">사용구분</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="modalReceiptType" value="O" checked>
                            <span>일회성</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="modalReceiptType" value="F">
                            <span>고정</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">결제수단</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="modalPaymentType" value="C" checked>
                            <span>카드</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="modalPaymentType" value="M">
                            <span>현금</span>
                        </label>
                    </div>
                </div>

                <div class="form-group" id="modalInstallmentGroup">
                    <label class="form-label" for="modalInstallment">할부</label>
                    <select class="form-select" id="modalInstallment">
                        <option value="001">일시불</option>
                        <option value="002">2개월 할부</option>
                        <option value="003">3개월 할부</option>
                        <option value="004">4개월 할부</option>
                        <option value="005">5개월 할부</option>
                        <option value="006">6개월 할부</option>
                        <option value="007">7개월 할부</option>
                        <option value="008">8개월 할부</option>
                        <option value="009">9개월 할부</option>
                        <option value="010">10개월 할부</option>
                        <option value="011">11개월 할부</option>
                        <option value="012">12개월 할부</option>
                    </select>
                </div>

                <div class="modal__footer">
                    <button type="button" class="btn btn--secondary" id="modalCancelBtn">취소</button>
                    <button type="button" class="btn btn--primary" id="modalSaveBtn">저장</button>
                </div>
            </div>
        </div>

        <!-- 일괄 등록 모달 -->
        <div class="modal-overlay hidden" id="bulkModalOverlay">
            <div class="modal modal--wide">
                <h2 class="modal__title">사용내역 일괄 등록</h2>

                <div class="bulk-table-wrap">
                    <table class="bulk-table">
                        <thead>
                            <tr>
                                <th>사용일</th>
                                <th>사용명</th>
                                <th class="col-amount">금액</th>
                                <th>사용구분</th>
                                <th>대분류</th>
                                <th>소분류</th>
                                <th>결제수단</th>
                                <th>할부</th>
                                <th class="col-actions"></th>
                            </tr>
                        </thead>
                        <tbody id="bulkTbody"></tbody>
                    </table>
                </div>

                <div class="bulk-footer">
                    <button type="button" class="btn btn--secondary btn--sm" id="bulkAddRowBtn">+ 행 추가</button>
                    <div class="bulk-footer__summary" id="bulkSummary">총 0건 · 0원</div>
                </div>

                <div class="modal__footer">
                    <button type="button" class="btn btn--secondary" id="bulkCancelBtn">취소</button>
                    <button type="button" class="btn btn--primary" id="bulkSaveBtn">일괄 저장</button>
                </div>
            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/air-datepicker@3.6.0/air-datepicker.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/toast.js}"></script>
<script th:src="@{/js/receipt.js}"></script>
</body>
</html>
